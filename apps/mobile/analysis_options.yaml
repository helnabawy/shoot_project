# Strict static analysis. `flutter analyze` must report no issues (CI gate).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote the rules that catch real bugs from info to error.
    unawaited_futures: error
    discarded_futures: error
    avoid_dynamic_calls: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/core/l10n/generated/**

linter:
  rules:
    # Types and nullability
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_returning_null_for_void
    - avoid_type_to_string
    - cast_nullable_to_non_nullable
    - type_annotate_public_apis
    - unnecessary_nullable_for_final_variable_declarations

    # Async
    - avoid_void_async
    - discarded_futures
    - unawaited_futures

    # Immutability and style
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - sort_unnamed_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters

    # Imports: package imports everywhere, one direction only.
    - always_use_package_imports
    - directives_ordering

    # Errors and safety
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - only_throw_errors
    - throw_in_finally
    - use_build_context_synchronously

    # Flutter
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - use_key_in_widget_constructors

    # Tests
    - avoid_print
