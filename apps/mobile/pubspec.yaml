name: shoot_mobile
description: "Shoot mobile app (iOS and Android)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'

# Versions are pinned exactly (no caret), like payload/next/react in the web
# app. Bump them deliberately with `flutter pub upgrade --major-versions`, then
# re-pin. See README.md for why each package is here.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: 5.11.1
  equatable: 3.0.0
  flutter_bloc: 9.1.1
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  get_it: 9.3.0
  go_router: 18.1.4
  intl: 0.20.3
  shared_preferences: 2.5.6
  share_plus: 13.3.1
  url_launcher: 6.3.3
  image_picker: 1.2.4
  file_picker: 13.3.3
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: 10.0.0
  flutter_lints: 6.0.0
  mocktail: 1.0.5
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  # Generates AppLocalizations from the ARB files (see l10n.yaml).
  generate: true
