# Local services for development and end-to-end tests.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoot
      POSTGRES_PASSWORD: shoot
      POSTGRES_DB: shoot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shoot -d shoot']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
