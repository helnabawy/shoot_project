<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:linear-gradient(180deg,#2a3346,#0F1726 60%);color:#F4F1EA;font-family:Inter;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:18px 20px;font:600 14px Inter}

p{padding:14px 20px;font:500 16px/1.5 Inter;opacity:.8}

.card u{text-decoration:none;border:1px solid #55627a;border-radius:999px;padding:2px 12px}
.btn{margin:16px;background:#E3A84F;color:#0F1726;border-radius:999px;text-align:center;padding:16px;font:600 18px Inter}
</style></head><body>
<div class="top"><span>SHOOT PROJECT</span><span>☰</span></div>
<div class="photo"></div>
<h1>You brief.<br>We shoot.</h1>
<p>Describe the shoot in one line and see who is free.</p>
<div class="card">I need a <u>photographer</u> for <u>an event</u> in <u>Dubai</u></div>
<div class="btn">See who's free</div>
</body></html>
