<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#14141B;font-family:'Readex Pro',sans-serif;color:#14141B;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;color:#FFD23F;font:600 13px 'Martian Mono',monospace;letter-spacing:.12em}
.top b{font:800 15px 'Readex Pro';letter-spacing:.04em}
.pass{margin:4px 14px 0;background:#FFD23F;border-radius:18px;position:relative}
.band{display:flex;justify-content:space-between;padding:14px 18px 10px;font:600 11px 'Martian Mono';letter-spacing:.14em;border-bottom:2px solid #14141B}
.band span:last-child{font-family:'Readex Pro';letter-spacing:0;font-size:13px}
h1{font:800 54px/0.92 'Readex Pro';letter-spacing:-.03em;padding:18px 18px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid #14141B;margin-top:10px}
.f{padding:10px 18px 12px;border-bottom:2px solid #14141B}.f:nth-child(odd){border-right:2px solid #14141B}
.f small{display:block;font:600 10px 'Martian Mono';letter-spacing:.14em;opacity:.7}
.f strong{display:block;font:600 24px/1.1 'Readex Pro';margin-top:4px}
.f.open strong{color:#2340FF;text-decoration:underline 3px;text-underline-offset:5px}
.f.wide{grid-column:1/-1;border-right:0}
.perf{height:0;border-top:3px dashed #14141B;margin:0 0;position:relative}
.perf:before,.perf:after{content:'';position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:#14141B}.perf:before{left:-13px}.perf:after{right:-13px}
.stub{display:flex;justify-content:space-between;align-items:center;padding:20px 18px;background:#2340FF;color:#fff;border-radius:0 0 18px 18px}
.stub strong{font:800 30px 'Readex Pro';letter-spacing:-.02em}.stub em{font:600 11px 'Martian Mono';font-style:normal;letter-spacing:.12em;opacity:.8;writing-mode:vertical-rl}
.alt{color:#FFD23F;text-align:center;padding:18px;font:600 14px 'Readex Pro'}
</style></head><body>
<div class="top"><b>SHOOT PROJECT</b><span>عربي · ☰</span></div>
<div class="pass">
 <div class="band"><span>ADMIT ONE SHOOT</span><span>تصريح تصوير</span></div>
 <h1>You brief.<br>We shoot.</h1>
 <div class="grid">
  <div class="f"><small>I NEED A</small><strong>photographer</strong></div>
  <div class="f"><small>FOR</small><strong>an event</strong></div>
  <div class="f open"><small>ON</small><strong>any date</strong></div>
  <div class="f"><small>FOR</small><strong>2 hours</strong></div>
  <div class="f"><small>IN</small><strong>Dubai</strong></div>
  <div class="f"><small>SHOT BY</small><strong>anyone</strong></div>
 </div>
 <div class="perf"></div>
 <div class="stub"><strong>See who's free →</strong><em>SP-·····</em></div>
</div>
<div class="alt">Rather talk? WhatsApp us</div>
</body></html>
