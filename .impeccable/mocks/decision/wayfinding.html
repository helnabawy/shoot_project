<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#F3F4F1;--ink:#101614;--panel:#0B4A3A;--panel-2:#0E1A2B;--arrow:#F2B705;--rule:rgba(255,255,255,.18);--muted:rgba(255,255,255,.62)}
*{box-sizing:border-box;margin:0}
body{width:min(390px,100vw);min-height:844px;background:var(--ground);color:var(--ink);font-family:'Readex Pro',sans-serif;font-feature-settings:"tnum"}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px}
.top b{font-weight:600;font-size:15px;letter-spacing:.01em}.top span{font-size:14px;font-weight:500}
.intro{padding:6px 22px 18px}
.intro h1{font-weight:500;font-size:40px;line-height:1.02;letter-spacing:-.025em}
.intro .ar{font-weight:400;font-size:22px;color:#4A5450;margin-top:8px;text-align:right}
.sign{margin:0 14px;background:var(--panel);color:#fff;border-radius:14px;padding:6px 20px 8px}
.row{display:grid;grid-template-columns:70px minmax(0,1fr) 18px;align-items:baseline;gap:10px;padding:15px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row small{font-size:13px;color:var(--muted);font-weight:400}
.row strong{font-weight:500;font-size:22px;letter-spacing:-.01em}
.row i{font-style:normal;color:var(--arrow);font-size:18px;text-align:end}
.go{margin:10px 14px 0;background:var(--panel-2);color:#fff;border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center}
.go strong{font-weight:500;font-size:22px}.go span{width:44px;height:44px;border-radius:10px;background:var(--arrow);color:var(--panel-2);display:grid;place-items:center;font-size:22px;font-weight:600}
.alt{padding:16px 22px;font-size:15px;color:#3A4440}.alt u{text-underline-offset:4px}
</style></head><body>
<div class="top"><b>Shoot Project</b><span>العربية&nbsp;&nbsp;☰</span></div>
<div class="intro"><h1>You brief.<br>We shoot.</h1><div class="ar">أنت تحدّد. نحن نصوّر.</div></div>
<div class="sign">
 <div class="row"><small>I need a</small><strong>Photographer</strong><i>›</i></div>
 <div class="row"><small>For</small><strong>An event</strong><i>›</i></div>
 <div class="row"><small>On</small><strong>Any date</strong><i>›</i></div>
 <div class="row"><small>For</small><strong>2 hours</strong><i>›</i></div>
 <div class="row"><small>In</small><strong>Dubai</strong><i>›</i></div>
 <div class="row"><small>Shot by</small><strong>Anyone</strong><i>›</i></div>
</div>
<div class="go"><strong>See who's free</strong><span>→</span></div>
<p class="alt">Rather talk? <u>WhatsApp us</u></p>
</body></html>
