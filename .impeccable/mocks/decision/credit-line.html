<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Amiri:wght@400;700&family=Alexandria:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF8F4;--ink:#141414;--rose:#E8566F;--stone:#D9D2C7;--mute:#6E6A64}
*{box-sizing:border-box;margin:0}
body{width:min(390px,100vw);min-height:844px;background:var(--paper);color:var(--ink);font-family:'Alexandria',sans-serif}
.mast{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 10px;border-bottom:2px solid var(--ink)}
.mast b{font:500 22px 'Bodoni Moda',serif;letter-spacing:.02em}.mast span{font:500 12px 'Alexandria';letter-spacing:.12em}
.plate{position:relative;margin:0;height:400px;background:var(--rose);color:var(--paper)}
.plate small{position:absolute;top:14px;left:16px;font:500 10px 'Alexandria';letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.plate .ar{position:absolute;top:12px;right:16px;font:400 15px 'Amiri',serif}
.plate h1{position:absolute;left:16px;bottom:-22px;font:400 60px/.9 'Bodoni Moda',serif;letter-spacing:-.02em;color:var(--ink)}
.plate h1 i{font-style:italic;color:var(--paper)}
.credits{padding:40px 20px 0}
.c{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--stone);align-items:baseline}
.c small{font:500 10px 'Alexandria';letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.c strong{font:400 17px 'Alexandria'}
.c.open strong{color:var(--mute)}
.go{margin:18px 20px 0;border-top:3px solid var(--ink);padding-top:12px;display:flex;justify-content:space-between;font:600 18px 'Alexandria'}
.alt{padding:14px 20px;font:400 13px 'Alexandria';color:var(--mute)}
</style></head><body>
<div class="mast"><b>SHOOT PROJECT</b><span>AR / EN &nbsp; ☰</span></div>
<div class="plate"><small>Your shoot goes here</small><div class="ar">أنت تحدّد. نحن نصوّر.</div><h1>You brief.<br><i>We shoot.</i></h1></div>
<div class="credits">
 <div class="c"><small>Photographer</small><strong>Any available</strong></div>
 <div class="c"><small>Occasion</small><strong>Wedding</strong></div>
 <div class="c"><small>Date</small><strong>Fri 21 Nov 2026</strong></div>
 <div class="c open"><small>Duration</small><strong>How long?</strong></div>
 <div class="c"><small>Emirate</small><strong>Dubai</strong></div>
 <div class="c"><small>Shot by</small><strong>Anyone</strong></div>
</div>
<div class="go"><span>See who's free</span><span>→</span></div>
<p class="alt">Rather talk? WhatsApp us</p>
</body></html>
