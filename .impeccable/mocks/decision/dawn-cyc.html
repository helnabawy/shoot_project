<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0B0B10;--cobalt:#1F3A8A;--rose:#E99AA6;--day:#FFF7F0;--ink:#141420}
*{box-sizing:border-box;margin:0}
body{width:min(390px,100vw);min-height:844px;background:var(--night);color:#fff;font-family:'Rubik',sans-serif;font-feature-settings:"tnum"}
.top{display:flex;justify-content:space-between;padding:18px 20px;font:500 13px 'Rubik';letter-spacing:.06em}
.night{padding:14px 20px 26px}
.night h1{font:400 44px/1 'Saira Stencil One';letter-spacing:.01em}
.night .ar{font:400 20px 'Rubik';opacity:.7;margin-top:8px;text-align:right}
.band{padding:10px 20px}
.cobalt{background:var(--cobalt)}
.cue{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.cue:last-child{border-bottom:0}
.cue small{font:400 12px 'Saira Stencil One';opacity:.7}
.cue strong{font:500 20px 'Rubik'}
.cue em{font:400 12px 'Rubik';font-style:normal;opacity:.7}
.cue.open strong{opacity:.55;font-weight:400}
.rose{background:var(--rose);color:var(--ink);padding:16px 20px;font:400 14px 'Rubik'}
.rose b{font:400 13px 'Saira Stencil One'}
.day{background:var(--day);color:var(--ink);padding:18px 20px 30px}
.go{background:var(--ink);color:#fff;border-radius:4px;padding:18px 20px;display:flex;justify-content:space-between;font:500 20px 'Rubik'}
.alt{padding-top:14px;font:400 14px 'Rubik';color:#4A4A58}
</style></head><body>
<div class="top"><span>SHOOT PROJECT</span><span>العربية &nbsp; ☰</span></div>
<div class="night"><h1>YOU BRIEF.<br>WE SHOOT.</h1><div class="ar">أنت تحدّد. نحن نصوّر.</div></div>
<div class="band cobalt">
 <div class="cue"><small>Q1</small><strong>Photographer</strong><em>change</em></div>
 <div class="cue"><small>Q2</small><strong>A wedding</strong><em>change</em></div>
 <div class="cue"><small>Q3</small><strong>Fri 21 Nov</strong><em>change</em></div>
 <div class="cue open"><small>Q4</small><strong>How long?</strong><em>choose</em></div>
 <div class="cue"><small>Q5</small><strong>Dubai</strong><em>change</em></div>
 <div class="cue"><small>Q6</small><strong>Anyone available</strong><em>change</em></div>
</div>
<div class="rose"><b>5 OF 6 SET</b> &nbsp; Fixed price shown before you book</div>
<div class="day"><div class="go"><span>See who's free</span><span>→</span></div><p class="alt">Rather talk? WhatsApp us</p></div>
</body></html>
