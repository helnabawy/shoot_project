<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#F4F6F5;font-family:'Readex Pro',sans-serif;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:18px 20px;font:700 15px 'Readex Pro';color:#00703C}
.sign{margin:6px 14px;background:#00703C;color:#fff;border:4px solid #fff;outline:2px solid #00703C;border-radius:16px;padding:18px}
.sign h1{font:700 44px/1 'Readex Pro';letter-spacing:-.02em}.sign .ar{font:600 26px 'Readex Pro';text-align:right;opacity:.95;margin-top:6px}
.route{margin-top:16px;border-top:2px solid rgba(255,255,255,.5)}
.r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px solid rgba(255,255,255,.5)}
.r small{font:600 13px 'Readex Pro';opacity:.8}.r strong{font:700 24px 'Readex Pro'}.r strong:after{content:'  →';color:#F2B705}
.exit{margin:12px 14px;background:#0B3D91;color:#fff;border:4px solid #fff;outline:2px solid #0B3D91;border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center}
.exit strong{font:700 28px 'Readex Pro'}.exit span{background:#F2B705;color:#0B3D91;font:700 22px 'Readex Pro';width:44px;height:44px;border-radius:8px;display:grid;place-items:center}
</style></head><body>
<div class="top"><span>SHOOT PROJECT</span><span>عربي ☰</span></div>
<div class="sign"><h1>You brief.<br>We shoot.</h1><div class="ar">أنت تحدّد. نحن نصوّر.</div>
<div class="route">
<div class="r"><small>I need a</small><strong>photographer</strong></div>
<div class="r"><small>for</small><strong>an event</strong></div>
<div class="r"><small>on</small><strong>any date</strong></div>
<div class="r"><small>for</small><strong>2 hours</strong></div>
<div class="r"><small>in</small><strong>Dubai</strong></div>
</div></div>
<div class="exit"><strong>See who's free</strong><span>↗</span></div>
</body></html>
