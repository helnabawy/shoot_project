packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  # apps/mobile is a Flutter (Dart) app with its own toolchain; it is not a
  # pnpm package and must never be picked up by -r scripts.
  - "!apps/mobile"
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver
  - '@tailwindcss/oxide'
# Security floor for transitive dependencies (T068: pnpm audit --prod clean of high/critical).
overrides:
  dompurify: 3.4.17
  happy-dom: 21.0.4
