<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shoot, splash, the aperture opens</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.root{width:360px;height:780px;box-sizing:border-box;position:relative;overflow:hidden;background:#efe9e3;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,'Noto Sans Arabic',sans-serif}
/* the aperture opens once as the night lifts, focus locks on the wordmark and the playhead crossing the edit timeline is the load line; 2s at most, then it hands over to the landing; every keyframe is from-only, so the still state is the finished one */
@keyframes night{from{opacity:1}}
@keyframes glow{from{opacity:0}}
@keyframes letter{from{opacity:0;transform:translateY(22px)}}
@keyframes line{from{opacity:0;transform:translateY(10px)}}
@keyframes iris{from{transform:scale(.08) rotate(-70deg)}}
@keyframes lock{from{opacity:0;transform:scale(1.16)}}
@keyframes load{from{transform:translateX(-320px)}}
@keyframes played{from{transform:scaleX(.06)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.nt{opacity:0;animation:night .8s cubic-bezier(.2,0,0,1) both}
.gw{animation:glow .9s cubic-bezier(.2,0,0,1) .2s both}
.bk{animation:glow .9s cubic-bezier(.2,0,0,1) .3s both}
.ir{transform-box:view-box;transform-origin:180px 430px;animation:iris 1s cubic-bezier(.2,0,0,1) .1s both}
.pl{animation:load 1.9s linear .1s both}
.pd{transform-box:fill-box;transform-origin:0 50%;animation:played 1.9s linear .1s both}
.fx{position:relative;display:inline-block}
.fb{position:absolute;inset:-6px -14px -8px;animation:lock .4s cubic-bezier(.2,0,0,1) .95s both}
.fb i{position:absolute;width:18px;height:18px;border:2px solid #3d3632}
.fb i:nth-child(1){top:0;inset-inline-start:0;border-inline-end:0;border-bottom:0}.fb i:nth-child(2){top:0;inset-inline-end:0;border-inline-start:0;border-bottom:0}.fb i:nth-child(3){bottom:0;inset-inline-end:0;border-inline-start:0;border-top:0}.fb i:nth-child(4){bottom:0;inset-inline-start:0;border-inline-end:0;border-top:0}
.hud{position:absolute;inset-inline:28px;top:70px;display:flex;justify-content:space-between;font-size:12px;line-height:1;font-weight:600;letter-spacing:.04em;color:#3d3632;font-variant-numeric:tabular-nums;animation:line .5s cubic-bezier(.2,0,0,1) 1.2s both}
.hud.b{top:556px}
.hud span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.hud i{flex:none;width:7px;height:7px;border-radius:50%;background:#84583d}
.mark{position:absolute;left:28px;right:28px;top:150px}
.mark h1{margin:0;font-size:84px;line-height:1;font-weight:700;letter-spacing:-.045em;display:flex}
.mark h1 span{animation:letter .5s cubic-bezier(.2,0,0,1) .45s both}
.mark h1 span:nth-child(2){animation-delay:.52s}.mark h1 span:nth-child(3){animation-delay:.59s}.mark h1 span:nth-child(4){animation-delay:.66s}.mark h1 span:nth-child(5){animation-delay:.73s}
.mark p{margin:14px 0 0 4px;font-size:20px;font-weight:500;letter-spacing:-.01em;color:#3d3632;animation:line .5s cubic-bezier(.2,0,0,1) 1.1s both}
.ar{position:absolute;right:28px;top:66px;font-size:20px;font-weight:700;color:#3d3632;animation:line .5s cubic-bezier(.2,0,0,1) 1.2s both}
</style>
</helmet>
