<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shoot, place step, search results</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
/* Shoot canvas board styles, copied from the approved boards (S02, S07e): The Brief Bar, light theme. */
sc-for,sc-if{display:contents}
.root{width:360px;box-sizing:border-box;position:relative;overflow:hidden;isolation:isolate;background:#efe9e3;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,'Noto Sans Arabic',sans-serif;display:flex;flex-direction:column}
.root::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:-130px;inset-inline-end:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,228,.95) 0,rgba(255,233,207,.6) 34%,rgba(255,233,207,0) 68%)}
.hd{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 12px;box-sizing:border-box;flex:none}
.ib{width:44px;height:44px;border:0;background:transparent;color:#1d1d1f;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;text-decoration:none;font:inherit}
.ib.on{background:rgba(29,29,31,.06)}
.wm{text-decoration:none;color:#1d1d1f;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1}
.h1{margin:0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.03em}
.h3{margin:0;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.meta{font-size:13px;line-height:1.4;color:#6b6560}
.sub{margin:0;font-size:15px;line-height:1.5;color:#3a342f}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.gl{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6560}
.quiet{background:none;border:0;padding:0;color:#0848c2;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;width:max-content;flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.att{background:#ffe3d6;color:#6a1f00}.ok{background:#e3f3e8;color:#0f5a2e}.n{background:#f1eeea;color:#5c5752}
.panel{background:#fcfbfa;border:1px solid rgba(0,0,0,.08);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column}
.bar{background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.08);border-radius:14px;box-shadow:0 24px 60px rgba(40,25,12,.22);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:50px;padding:10px 12px;box-sizing:border-box;border-radius:9px;border:0;background:#e01414;color:#fff;text-decoration:none;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.top:hover{color:#fff;background:#c41010}
.top.c{justify-content:center}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 12px;box-sizing:border-box;border-radius:9px;border:1px solid rgba(0,0,0,.32);background:transparent;color:#1d1d1f;text-decoration:none;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.btn2:hover{color:#1d1d1f;background:rgba(29,29,31,.05)}
.btn2[aria-disabled="true"]{color:#6b6560;border-color:rgba(0,0,0,.14);cursor:default}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{border-top:1px solid rgba(0,0,0,.08)}
.list>li:last-child{border-bottom:1px solid rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 0;box-sizing:border-box;color:#1d1d1f;text-decoration:none;font-size:16px;line-height:1.3}
.row .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t30{flex:none;width:30px;height:30px;border-radius:8px;background:#e6e0d9;color:#5c5752;display:inline-flex;align-items:center;justify-content:center}
.t30.okt{background:#e3f3e8;color:#0f5a2e}.t30.dk{background:#1d1d1f;color:#f5f5f7;font-weight:700;font-size:15px;letter-spacing:-.03em}
.photo{flex:none;width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:radial-gradient(circle at 72% 22%,rgba(255,246,232,.92) 0,rgba(255,246,232,0) 46%),linear-gradient(160deg,#ecd6bd,#caa07c);color:#4a2e20}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;height:44px;padding:0 14px;box-sizing:border-box;border-radius:9px;border:1px solid rgba(0,0,0,.32);background:transparent;color:#1d1d1f;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:#0a60ff;border-color:#0a60ff;color:#fff;font-weight:500}
.sent{display:flex;align-items:center;gap:12px;padding:12px 16px;box-sizing:border-box}
.sent p{margin:0;font-size:19px;font-weight:500;line-height:1.45;letter-spacing:-.01em}
.tok{background:rgba(10,96,255,.1);color:#0848c2;border-radius:6px;padding:0 4px}
.ln{display:flex;align-items:flex-start;gap:12px;min-height:44px;border-top:1px solid rgba(0,0,0,.08);padding:10px 0;font-size:16px;line-height:1.375;box-sizing:border-box}
.ln:first-child{border-top:0}
.ln .l{flex:1;display:flex;flex-direction:column;gap:2px}
.tot{border-top:2px solid #1d1d1f;margin-top:4px;padding-top:12px}
.amt{display:flex;align-items:center;gap:8px}
.step{flex:none;width:50px;height:56px;border-radius:9px;border:1px solid rgba(0,0,0,.32);background:transparent;color:#1d1d1f;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.field{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:8px;height:56px;box-sizing:border-box;border-radius:9px;border:1px solid rgba(0,0,0,.32);background:#fff;padding:0 12px}
.field span{font-size:15px;color:#6b6560;font-weight:500;align-self:center}
.field input{width:110px;border:0;background:transparent;color:#1d1d1f;font:inherit;font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;height:52px;padding:0;outline:0;align-self:center}
.field:focus-within{outline:2px solid #0a60ff;outline-offset:2px}
.price{font-size:22px;font-weight:700;letter-spacing:-.02em}
a:focus-visible,button:focus-visible{outline:2px solid #0a60ff;outline-offset:2px}

/* account lists and form fields (from S07a, S03) */
.rows{list-style:none;margin:6px 0 0;padding:0}
.rows>li{border-top:1px solid rgba(0,0,0,.08)}
.rows>li:last-child{border-bottom:1px solid rgba(0,0,0,.08)}
.rows a{display:flex;align-items:center;gap:12px;min-height:48px;color:#1d1d1f;text-decoration:none;font-size:16px}
.st{margin-inline-start:auto;font-size:13px;color:#6b6560;flex:none}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.inp{height:44px;box-sizing:border-box;padding:0 12px;border-radius:9px;border:1px solid rgba(0,0,0,.32);background:#fcfbfa;color:#1d1d1f;font:inherit;font-size:16px;font-weight:400;width:100%}
.inp:focus{outline:2px solid #0a60ff;outline-offset:2px}
.strong{font-weight:600}

/* Arabic */
.root[dir="rtl"] *{letter-spacing:0}
.root[dir="rtl"] .gl{font-size:12px;text-transform:none}
.root[dir="rtl"] .h1{line-height:1.45}
.root[dir="rtl"] .h3{line-height:1.5}
.root[dir="rtl"] .meta{line-height:1.6}

/* dark theme: ground #141416, ink #f5f5f7, mute #a29d98 */
.root.dk{background:#141416;color:#f5f5f7}
.root.dk::before{background:radial-gradient(circle,rgba(255,206,160,.13) 0,rgba(255,206,160,.06) 34%,rgba(255,206,160,0) 68%)}
.dk .ib,.dk .wm,.dk .row,.dk .rows a,.dk .btn2,.dk .strong{color:#f5f5f7}
.dk .meta,.dk .gl,.dk .st{color:#a29d98}
.dk .sub{color:#d6d2cd}
.dk a,.dk .quiet{color:#b7d0ff}
.dk a.top,.dk a.btn2{color:#fff}
.dk .panel{background:#232326;border-color:rgba(255,255,255,.1);box-shadow:none}
.dk .btn2{border-color:rgba(255,255,255,.36)}
.dk .btn2:hover{background:rgba(255,255,255,.07)}
.dk .list>li,.dk .list>li:last-child,.dk .rows>li,.dk .hair{border-color:rgba(255,255,255,.1)}
.dk .att{background:#4a2416;color:#ffd9c7}.dk .ok{background:#15301f;color:#a6e6bd}.dk .n{background:#3a3a3f;color:#d6d2cd}
.dk .t30{background:#3a3a3f;color:#d6d2cd}
.dk .photo{background:radial-gradient(circle at 28% 22%,rgba(255,214,170,.35) 0,rgba(255,214,170,0) 46%),linear-gradient(200deg,#5d4634,#34271e);color:#f1dcc6}
.hair{border-top:1px solid rgba(0,0,0,.08)}
.dk .hd.line{border-color:rgba(255,255,255,.1)}
.hd.line{border-bottom:1px solid rgba(0,0,0,.08)}
.dk .ib.on{background:rgba(255,255,255,.1)}

/* map (stand-in drawing of a map tile; the real one is a Google map) */
.map{position:relative;overflow:hidden;border-radius:10px;background:#e8e4dc;border:1px solid rgba(0,0,0,.08)}
.map svg.roads{position:absolute;inset:0;width:100%;height:100%}
.map .area{position:absolute;border-radius:50%;background:rgba(10,96,255,.14);border:2px solid rgba(10,96,255,.55);transform:translate(-50%,-50%)}
.map .pin{position:absolute;transform:translate(-50%,-100%);color:#e01414;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.map .me{position:absolute;width:14px;height:14px;border-radius:50%;background:#0a60ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,96,255,.18);transform:translate(-50%,-50%)}
.map .credit{position:absolute;inset-inline-end:6px;bottom:4px;font-size:10px;color:#6b6560}
.dk .map{background:#2a2a2e;border-color:rgba(255,255,255,.1)}
.dk .map .credit{color:#a29d98}
.place{display:flex;align-items:center;gap:10px}
.place .map{flex:none;width:84px;height:64px}
.place .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.35}
.bad{background:#fde3e1;color:#9b1c1c}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.note.n{background:#f1eeea;color:#3a342f}.note.bad{background:#fde3e1;color:#9b1c1c}
.slot{color:#6b6560;border-bottom:2px dotted #a29d98}
.top[aria-disabled="true"]{background:#d9d3cc;color:#6b6560;cursor:default}
.top[aria-disabled="true"]::after{display:none}
.map .hint{position:absolute;inset:auto 12px 12px;background:rgba(252,251,250,.94);border-radius:9px;padding:8px 10px;font-size:13px;color:#3a342f;text-align:center}
a{color:#0848c2}a:hover{color:#0a60ff}
</style>
</helmet>
