name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URI: postgres://shoot:shoot@127.0.0.1:5432/shoot
  PAYLOAD_SECRET: ci-only-secret-0123456789abcdef0123456789
  PREVIEW_SECRET: ci-preview-secret
  CRON_SECRET: ci-cron-secret
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SEED_ADMIN_EMAIL: admin@example.test
  SEED_ADMIN_PASSWORD: ci-admin-password-1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck, lint, unit, component, integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Every scenario in a quickstart mapping table has its tests, named with its id (SC-004).
      - run: node scripts/check-scenario-tests.mjs
      # Integration tests start their own PostgreSQL with Testcontainers (Docker is available on ubuntu-latest).
      - run: pnpm --filter @shoot/domain test:coverage
      - run: pnpm --filter web test:coverage
      - name: Migration drift check
        working-directory: apps/web
        env: { PAYLOAD_MIGRATING: 'true' }
        run: |
          before=$(ls src/migrations/*.ts | wc -l)
          pnpm payload migrate:create drift_check --skip-empty
          after=$(ls src/migrations/*.ts | wc -l)
          if [ "$before" != "$after" ]; then
            echo "::error::The Payload schema changed without a committed migration. Run 'pnpm db:migration:create <name>' and commit it."
            exit 1
          fi

  mobile:
    # Feature 007 (research R12): format, analyze, unit/widget tests with goldens, then the
    # design-fidelity check of every shipped screen against its canvas board. macOS is the one
    # platform goldens are made and checked on (decided 2026-11-11), so this job runs on a macOS
    # runner (Apple silicon, like the owner's Mac). Branch protection must require this job.
    name: Mobile (Flutter) and design fidelity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the coverage gate diffs against the base branch
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: 3.47.9, channel: stable, cache: true }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Flutter checks
        working-directory: apps/mobile
        env: { GOLDENS: '1' }
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test --coverage
      - name: Coverage of changed lines (>= 80 %)
        if: github.event_name == 'pull_request'
        run: node scripts/check-changed-coverage.mjs apps/mobile/coverage/lcov.info origin/${{ github.base_ref }} 80
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter design-fidelity exec playwright install chromium
      - run: pnpm fidelity
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: design-fidelity-report, path: tools/design-fidelity/build/report, retention-days: 14 }

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: shoot, POSTGRES_PASSWORD: shoot, POSTGRES_DB: shoot }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shoot -d shoot" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web build
      # playwright.config.ts starts the server: migrate, seed, then next start.
      - run: pnpm --filter web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: shoot, POSTGRES_PASSWORD: shoot, POSTGRES_DB: shoot }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shoot -d shoot" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Migrate and seed
        working-directory: apps/web
        env: { SEED_DEMO_CREATORS: '1', SEED_DEMO_GUIDES: '1' }  # the budgets are measured on pages that have creators
        run: |
          PAYLOAD_MIGRATING=true pnpm payload migrate
          pnpm seed
      - run: npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.json
      - run: npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.dark.json
      # Quick Match private pages (step 2, quotation) from the demo quotation; links derived from PAYLOAD_SECRET.
      - run: npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.quick-match.cjs
      - run: npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.quick-match.cjs
        env: { LHCI_THEME: dark }
