name: Android APK

# Builds the release APK of apps/mobile.
# - Push to main touching the app: APK as a workflow artifact (kept 30 days), plus the rolling
#   "latest" pre-release, replaced on every build: …/releases/download/latest/shoot-latest.apk
# - Tag v* (e.g. v0.1.0): the same, plus a GitHub Release with the APK attached.
# - Run workflow (Actions tab): build on demand, optionally against another API.
#
# Settings → Secrets and variables → Actions:
#   Variable  API_BASE_URL               the web app the APK calls (default https://shoot-project.vercel.app)
#   Variable  APP_ENV                    development | staging | production (default staging)
#   Secrets   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)       } optional: without
#             ANDROID_KEYSTORE_PASSWORD  its password                               } them the APK is
#             ANDROID_KEY_ALIAS          the key alias                              } signed with a debug
#             ANDROID_KEY_PASSWORD       the key password                           } key (sideload only)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL (empty: the API_BASE_URL variable)'
        required: false
      app_env:
        description: 'APP_ENV'
        type: choice
        options: [staging, production, development]
        default: staging

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the GitHub Release on a tag, the rolling "latest" pre-release on main

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://shoot-project.vercel.app' }}
      APP_ENV: ${{ inputs.app_env || vars.APP_ENV || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: 3.47.9, channel: stable, cache: true }

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Release keystore (when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key (sideload only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        # The run number is the build number, so every CI APK installs over the previous one.
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV="$APP_ENV"
          name="shoot-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$name\` → \`$API_BASE_URL\` ($APP_ENV)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: apps/mobile/build/${{ env.APK_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" "build/$APK_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Rolling "latest" pre-release (pushes to main only)
        # One fixed file name, so the download link never changes. A pre-release is never
        # GitHub's "Latest release", so a v* release keeps that badge.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp "build/$APK_NAME" build/shoot-latest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/shoot-latest.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest main build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7} against $API_BASE_URL ($APP_ENV). Replaced on every push to main that touches the app."

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
