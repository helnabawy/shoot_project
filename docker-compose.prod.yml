# Production-like stack: PostgreSQL, a one-off migration, then two web instances.
#   docker compose -f docker-compose.prod.yml --env-file apps/web/.env up --build
# Put a load balancer or reverse proxy (TLS) in front of web; it is stateless.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoot}
      POSTGRES_DB: ${POSTGRES_DB:-shoot}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-shoot} -d ${POSTGRES_DB:-shoot}']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: migrate }
    environment: &app-env
      DATABASE_URI: postgres://${POSTGRES_USER:-shoot}:${POSTGRES_PASSWORD:-shoot}@postgres:5432/${POSTGRES_DB:-shoot}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?set PREVIEW_SECRET}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args: { NEXT_PUBLIC_SITE_URL: '${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}' }
    environment: *app-env
    deploy: { replicas: 2 }
    ports:
      - '3000-3001:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata-prod:
